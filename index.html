<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>weather-app</title>
    <link rel='stylesheet' href='index.css'>
</head>
<body>
<div class="heading">
    <h1>weather app</h1></div>
    <div class="searchbar">
    <input type="text" id="search" placeholder="enter a city name">
    <button id="searchbtn">search</button>
    </div>

<div class="weatherCard">
    <div class="weather">
        <p id="cityname">karachi | pakistan</p>
        <h1 id="temperature">28 °C</h1>
    </div>
    <div class="weatherDetails">
        <div>
            <p>humidity</p>
            <h2 id="humidity">65%</h2>
        </div>
        <div>
            <p>windspeed</p>
            <h2 id="windspeed">17km/h</h2>
        </div>
    </div>
</div>
    
         
         

</div>
    <script src="index.js"></script>

</body>
</html>
